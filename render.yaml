services:
  - type: web
    name: fieldfix
    plan: free
    rootDir: ./FieldFix
    buildCommand: dotnet publish -c Release -o publish
    startCommand: ASPNETCORE_URLS=http://0.0.0.0:$PORT dotnet publish/FieldFix.dll
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        value: Data Source=/tmp/fieldfix.db
